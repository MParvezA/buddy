amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 1.0
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    update_min_a: 0.2
    update_min_d: 0.25
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    topic_name: /map
    frame_id: map

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [map_server, amcl]
